name: Documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  okf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix .okf/tools --ignore-scripts --no-audit --no-fund
      - run: node .okf/tools/cli.mjs check .
      - run: node .okf/check-external.mjs
