# Publishes a Foundry-installable release.
#
# Cut a release from the Actions tab: Release -> Run workflow -> enter the
# version (e.g. 0.1.5). CI stamps that version into both manifests, validates
# everything, and only then commits to main, tags that commit, and publishes.
# The tag therefore always points at a tree that declares its own version.
#
# Pushing a tag by hand still works, but CI can only VERIFY the versions in that
# case -- a tag has already frozen the tree, so nothing can be bumped into it.
# A mismatch fails the build instead of shipping a wrong version number.
#
# The two manifests are consumed differently, which is why they are stamped at
# different points below:
#   module.json   -- fetched as a RELEASE ASSET by Foundry. What ships is the
#                    runner's copy, attached to the release.
#   manifest.json -- read straight from the REPO, because the SillyTavern
#                    extension is copied in by hand. It has to be committed.
#
# Both are committed to main in the same "release: vX.Y.Z" commit, and stamping
# runs BEFORE that commit -- so the repo's module.json carries a `download` URL
# pinned to this tag. That keeps the repo honest about the release it just cut;
# it is not a latest-tracking manifest, and nobody should paste a raw repo link
# into Foundry.
#
# Foundry's "Install Module" dialog fetches the manifest URL, reads `download`,
# and unzips it into Data/modules/<id>/. So the zip must contain module.json at
# its ROOT -- not nested inside a folder.
#
# Two asset URLs matter afterwards:
#   .../releases/latest/download/module.json   <- stable, always newest (update checks)
#   .../releases/download/v0.1.5/module.zip    <- version-pinned payload
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.1.5)'
        required: true

permissions:
  contents: write

env:
  MODULE_DIR: foundry-module/foundryvtt-to-sillytavern-nhp-uplink
  ST_EXT_DIR: st-ui-extension/sillytavern-foundryvtt-input
  ST_PLUGIN_DIR: st-server-plugin/sillytavern-foundryvtt-input-server-plugin
  ST_MIRROR_REPO: masterevan27/sillytavern-foundryvtt-input

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      # Full history, and main rather than the detached tag, so the dispatch
      # path can commit the bump and push a tag from it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Version '$VERSION' is not semver-like."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - name: Check the tag is free
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Pick a new version, or delete the tag first."
            exit 1
          fi
          echo "$TAG is free"

      - name: Stamp the extension manifest
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          jq --arg v "$VERSION" --arg home "$REPO_URL" \
             '.version = $v | .homePage = $home' \
             "$ST_EXT_DIR/manifest.json" > st.tmp
          mv st.tmp "$ST_EXT_DIR/manifest.json"

          jq --arg v "$VERSION" '.version = $v' \
             "$MODULE_DIR/module.json" > mod.tmp
          mv mod.tmp "$MODULE_DIR/module.json"

          echo "--- stamped extension manifest ---"
          cat "$ST_EXT_DIR/manifest.json"

      - name: Stamp module.json
        working-directory: ${{ env.MODULE_DIR }}
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          jq --arg v "$VERSION" \
             --arg dl "$REPO_URL/releases/download/$TAG/module.zip" \
             --arg mf "$REPO_URL/releases/latest/download/module.json" \
             '.version = $v | .download = $dl | .manifest = $mf' \
             module.json > module.stamped.json
          mv module.stamped.json module.json
          echo "--- stamped manifest ---"
          cat module.json

      # Everything here must pass BEFORE anything is committed, tagged or
      # published -- a failure at this point leaves the repo untouched.
      - name: Sanity-check the manifests
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd "$GITHUB_WORKSPACE/$MODULE_DIR"
          jq -e '.id and .version and .manifest and .download and (.esmodules | length > 0)' module.json > /dev/null
          for f in $(jq -r '.esmodules[]' module.json); do
            test -f "$f" || { echo "::error::esmodule missing from package: $f"; exit 1; }
            # Checked as .mjs so `import`/`export` parse on any runner Node.
            cp "$f" "$RUNNER_TEMP/check.mjs" && node --check "$RUNNER_TEMP/check.mjs"
          done
          for f in $(jq -r '.styles // [] | .[]' module.json); do
            test -f "$f" || { echo "::error::stylesheet missing from package: $f"; exit 1; }
          done

          cd "$GITHUB_WORKSPACE/$ST_EXT_DIR"
          jq -e --arg v "$VERSION" --arg home "$REPO_URL" \
             '.version == $v and .homePage == $home and .js and .css and .display_name' \
             manifest.json > /dev/null || {
               echo "::error::manifest.json failed validation. Wanted version $VERSION and homePage $REPO_URL. Found:"
               jq -c '{version, homePage, js, css, display_name}' manifest.json
               echo "::error::On a hand-pushed tag, bump manifest.json and re-tag, or cut the release from the Actions tab so CI stamps it for you."
               exit 1
             }
          test -f "$(jq -r '.js' manifest.json)"  || { echo "::error::manifest js file missing"; exit 1; }
          test -f "$(jq -r '.css' manifest.json)" || { echo "::error::manifest css file missing"; exit 1; }
          node --check "$(jq -r '.js' manifest.json)"
          echo "manifests and scripts OK"

      # Only now is it safe to write to the repo. Tags pushed with GITHUB_TOKEN
      # do not start another workflow run, so this cannot loop back into the
      # push-tags trigger above.
      - name: Commit the bump and tag it
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ST_EXT_DIR/manifest.json" "$MODULE_DIR/module.json"
          if git diff --staged --quiet; then
            echo "Manifests already declare $VERSION; tagging the current commit."
          else
            git commit -m "release: $TAG"
            git push origin HEAD:main
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - name: Build module.zip (module.json at zip root)
        working-directory: ${{ env.MODULE_DIR }}
        run: |
          zip -r "$GITHUB_WORKSPACE/module.zip" . -x '*.git*'
          echo "--- zip contents ---"
          unzip -l "$GITHUB_WORKSPACE/module.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: |
            module.zip
            ${{ env.MODULE_DIR }}/module.json

  # Mirrors the SillyTavern UI extension into its own repo, with manifest.json
  # at the ROOT -- the only layout SillyTavern's "Install extension" dialog
  # understands. The mirror is a DISTRIBUTION ARTIFACT, not a fork: nothing is
  # developed there, every sync overwrites it wholesale, and this repo stays the
  # single source of truth.
  #
  # It is a separate job so a mirror failure goes red WITHOUT marking the release
  # itself failed. By this point the Foundry release has already published, and
  # that stays true whatever happens here.
  #
  # Needs a fine-grained PAT in the ST_MIRROR_TOKEN secret, scoped to the mirror
  # repo alone, with Contents: read and write -- GITHUB_TOKEN cannot push across
  # repositories. Because it is a PAT and not GITHUB_TOKEN, these pushes DO
  # trigger workflows in the mirror, so keep that repo workflow-free.
  mirror:
    needs: release
    runs-on: ubuntu-latest
    steps:
      # The tag exists by now and is the tree carrying the stamped manifest, so
      # mirror from the tag -- never from whatever main may have drifted to.
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          path: src

      - name: Check out the mirror
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ST_MIRROR_REPO }}
          token: ${{ secrets.ST_MIRROR_TOKEN }}
          path: mirror
          fetch-depth: 0

      - name: Sync the extension to the mirror root
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          MIRROR_URL: ${{ github.server_url }}/${{ env.ST_MIRROR_REPO }}
        run: |
          # --delete so a file dropped upstream disappears here too; this is a
          # mirror, not an accumulator. It wipes LICENSE and README.md as well,
          # which is fine -- both are regenerated immediately below.
          rsync -a --delete --exclude '.git/' "src/$ST_EXT_DIR/" mirror/

          # GPL-3.0-or-later: the mirror distributes the code, so it has to
          # carry the licence with it.
          cp src/LICENSE mirror/LICENSE

          # auto_update is false upstream because that copy is hand-installed
          # into a plain folder, where SillyTavern's git pull has nothing to
          # pull. The mirror IS a clone, so here it can be true.
          jq '.auto_update = true' mirror/manifest.json > au.tmp
          mv au.tmp mirror/manifest.json

          # Written with echo rather than a heredoc: a heredoc terminator cannot
          # be indented, and un-indenting it here would end this YAML block.
          {
            echo '# FoundryVTT to SillyTavern NHP Uplink -- SillyTavern extension'
            echo
            echo '> **Generated repository -- do not edit by hand.** Every file here is'
            echo "> overwritten on each release by the \`mirror\` job in"
            echo "> <$REPO_URL/blob/main/.github/workflows/release.yml>."
            echo "> Please open issues and pull requests against <$REPO_URL> instead."
            echo
            echo 'This is the SillyTavern UI half of the NHP Uplink, published on its own'
            echo "so SillyTavern's extension installer can reach it. On its own it does"
            echo 'nothing.'
            echo
            echo '## Install'
            echo
            echo 'In SillyTavern, go to **Extensions -> Install extension** and paste:'
            echo
            echo '```'
            echo "$MIRROR_URL"
            echo '```'
            echo
            echo "Then follow the full setup at <$REPO_URL#install>. You also need the"
            echo 'Foundry module and the SillyTavern **server plugin** -- the server plugin'
            echo 'is what this extension actually talks to.'
            echo
            echo '## License'
            echo
            echo 'GPL-3.0-or-later -- see [LICENSE](LICENSE).'
            echo
            echo 'LANCER is a trademark of Massif Press. This is an unofficial community'
            echo 'tool with no affiliation to Massif Press, Foundry Gaming LLC, or the'
            echo 'SillyTavern project.'
          } > mirror/README.md

      # Cheap insurance: a mirror that fails to parse is worse than no mirror,
      # because SillyTavern will clone it happily and then break at load.
      - name: Sanity-check the mirror
        working-directory: mirror
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          jq -e --arg v "$VERSION" \
             '.version == $v and .auto_update == true and .js and .css and .display_name' \
             manifest.json > /dev/null
          test -f "$(jq -r '.js' manifest.json)"
          test -f "$(jq -r '.css' manifest.json)"
          test -f LICENSE
          node --check "$(jq -r '.js' manifest.json)"
          echo "mirror OK"

      - name: Commit and tag the mirror
        working-directory: mirror
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Mirror already matches $TAG."
          else
            git commit -m "sync: $TAG (from $GITHUB_REPOSITORY@$TAG)"
            git push
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::warning::Mirror already carries tag $TAG; leaving it as it is."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
